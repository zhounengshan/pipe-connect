@media(display-mode:standalone){main{padding-top:max(12px,env(safe-area-inset-top))}} </style></head><body><main><header class="header"><div class="logo">💧 水管大师<small>PIPE MASTER · V2</small></div><button id="sound" class="icon" aria-label="开启音效" aria-pressed="false">♪</button></header><div class="mode" role="group" aria-label="游戏模式"><button id="relax" class="active">☁ 休闲闯关</button><button id="challenge">⚡ 限步挑战</button></div><div class="hud"><div><small id="world">珊瑚海湾</small><div class="level">第 <b id="level">1</b> 关 <span id="size">4×4</span></div></div><div class="numbers"><div><small id="movesLabel">旋转次数</small><b id="moves">0</b></div><div><small>总星星</small><b id="stars" class="gold">★ 0</b></div></div></div><div class="mission"><span>连接水源，沿路收集水晶</span><b class="gem" id="gems">◆ 0 / 3</b></div><div class="progress"><i id="bar"></i></div><div class="stage" id="stage"><div class="board" id="board" role="group" aria-label="点击旋转管道"></div><div class="ports"><span>↑ 左上进水</span><span>右下出水 ↓</span></div></div><div id="status" class="status" role="status" aria-live="polite">点击管道旋转，让水流经过所有水晶。</div><div class="tools"><button id="undo" class="tool"><span>↶</span>撤销一步</button><button id="hint" class="tool"><span>✦</span>智能提示</button><button id="reset" class="tool"><span>↻</span>重新挑战</button></div><button id="valve" class="primary">💧 打开水阀</button><div class="foot">点击旋转 · 收集水晶 · 三星通关 · 自动保存</div></main><canvas id="fx" aria-hidden="true"></canvas><div class="overlay" id="modal" hidden><div class="card"><div id="modalStars" class="bigstars">★★★</div><h2 id="modalTitle">完美通水！</h2><p id="modalText"></p><div class="reward" id="reward"></div><button class="primary" id="next">继续下一关 →</button><button class="tool" id="close">查看水路</button></div></div><script>

const dirs=[[-1,0],[0,1],[1,0],[0,-1]];
function rotate(mask){return ((mask<<1)&15)|(mask>>3)}
function random(seed){let x=seed|0;return ()=>{x^=x<<13;x^=x>>>17;x^=x<<5;return (x>>>0)/4294967296}}
function makePuzzle(level){const n=level<4?4:level<12?5:6,rng=random(level*1777+93),end=n*n-1;let path=[],seen=new Set();function dfs(i){path.push(i);seen.add(i);if(i===end)return true;const options=dirs.map((d,k)=>{let r=Math.floor(i/n)+d[0],c=i%n+d[1];return {j:r*n+c,k,r,c,v:rng()}}).filter(o=>o.r>=0&&o.r<n&&o.c>=0&&o.c<n&&!seen.has(o.j)).sort((a,b)=>a.v-b.v);for(const o of options)if(dfs(o.j))return true;seen.delete(i);path.pop();return false}dfs(0);let solution=Array(n*n).fill(0);solution[0]|=1;solution[end]|=4;for(let k=0;k<path.length-1;k++){let a=path[k],b=path[k+1],d=b===a+1?1:b===a-1?3:b>a?2:0;solution[a]|=1<<d;solution[b]|=1<<((d+2)%4)}for(let i=0;i<solution.length;i++)if(!solution[i])solution[i]=rng()<.4?5:3;let cells=solution.map(v=>{for(let k=Math.floor(rng()*4);k>0;k--)v=rotate(v);return v});if(cells.every((v,i)=>v===solution[i]))cells[0]=rotate(cells[0]);return {n,path,solution,cells,initial:[...cells]}}
function trace(p){let reached=[],seen=new Set(),queue=[];if(p.cells[0]&1){queue.push(0);seen.add(0)}while(queue.length){let i=queue.shift();reached.push(i);for(let d=0;d<4;d++){if(!(p.cells[i]&(1<<d)))continue;let r=Math.floor(i/p.n)+dirs[d][0],c=i%p.n+dirs[d][1];if(r<0||r>=p.n||c<0||c>=p.n)continue;let j=r*p.n+c;if(!seen.has(j)&&(p.cells[j]&(1<<((d+2)%4)))){seen.add(j);queue.push(j)}}}return {reached,won:seen.has(p.n*p.n-1)&&!!(p.cells[p.n*p.n-1]&4)}}
function turns(a,b){for(let k=0;k<4;k++,a=rotate(a))if(a===b)return k;return 0}
function build(level){let p=makePuzzle(level),rng=random(level*899+1);p.cells=[...p.solution];let candidates=p.path.filter(i=>i!==0&&i!==p.n*p.n-1);const shuffled=[...candidates].sort(()=>rng()-.5);let count=Math.min(candidates.length,3+Math.floor(level*1.3));for(let i of shuffled.slice(0,count)){let k=1+Math.floor(rng()*3);while(k--)p.cells[i]=rotate(p.cells[i]);if(p.cells[i]===p.solution[i])p.cells[i]=rotate(p.cells[i])}for(let i=0;i<p.cells.length;i++)if(!p.path.includes(i)){let k=Math.floor(rng()*4);while(k--)p.cells[i]=rotate(p.cells[i])}p.initial=[...p.cells];p.budget=p.path.reduce((s,i)=>s+turns(p.cells[i],p.solution[i]),0)+Math.max(4,Math.ceil(count*.35));p.crystals=[...new Set([.25,.5,.75].map(f=>p.path[Math.floor((p.path.length-1)*f)]))];return p}
const $=id=>document.getElementById(id);let progress={level:1,stars:0,streak:0};try{let s=JSON.parse(localStorage.getItem('pipe-master-v2')||localStorage.getItem('pipe-connect-v1'));if(s&&Number.isInteger(s.level)&&s.level>0&&s.level<1e6)progress={level:s.level,stars:Math.max(0,Number(s.stars)||0),streak:Math.max(0,Number(s.streak)||0)}}catch{}
let p,level,moves=0,hints=0,busy=false,won=false,mode='relax',wet=new Set(),history=[],timer,buttons=[],angles=[],audio,sound=false,preview,particles=[],animating=false;const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function save(){try{localStorage.setItem('pipe-master-v2',JSON.stringify(progress))}catch{$('status').textContent+='（此浏览器无法保存进度）'}}
function play(kind){if(!sound)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume();const notes=kind==='win'?[523,659,784,1047]:kind==='fail'?[220,164]:kind==='water'?[440,660]:[280+Math.random()*100];notes.forEach((f,k)=>{let t=audio.currentTime+k*.10,o=audio.createOscillator(),g=audio.createGain();o.type=kind==='tap'?'triangle':'sine';o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*.8,t+.18);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.075,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+.24);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.25)})}catch{}}
const ctx=$('fx').getContext('2d');function resize(){let d=Math.min(devicePixelRatio||1,2);$('fx').width=innerWidth*d;$('fx').height=innerHeight*d;ctx.setTransform(d,0,0,d,0,0)}resize();addEventListener('resize',resize);
function burst(el,amount=12,gold=false){if(reduced)return;let r=el.getBoundingClientRect();for(let i=0;i<amount;i++){let a=Math.random()*Math.PI*2,v=1+Math.random()*5;particles.push({x:r.x+r.width/2,y:r.y+r.height/2,vx:Math.cos(a)*v,vy:Math.sin(a)*v-2,life:1,size:2+Math.random()*4,color:gold?['#ffd777','#ff98c8','#81fff0'][i%3]:['#55dfff','#e0ffff','#0bb8ff'][i%3]})}if(!animating){animating=true;requestAnimationFrame(frame)}}
function frame(){ctx.clearRect(0,0,innerWidth,innerHeight);particles=particles.filter(a=>a.life>0);for(let a of particles){a.x+=a.vx;a.y+=a.vy;a.vy+=.08;a.life-=.022;ctx.globalAlpha=Math.max(0,a.life);ctx.fillStyle=a.color;ctx.beginPath();ctx.arc(a.x,a.y,a.size,0,7);ctx.fill()}ctx.globalAlpha=1;if(particles.length)requestAnimationFrame(frame);else animating=false}
function curve(mask){const ends=[[50,0],[100,50],[50,100],[0,50]],d=[0,1,2,3].filter(k=>mask&(1<<k));let a=ends[d[0]],b=ends[d[1]];return d[1]-d[0]===2?`M${a} L${b}`:`M${a} Q50 50 ${b}`}
function svg(mask){let line=curve(mask);return `<svg viewBox="0 0 100 100" aria-hidden="true"><path class="pipe" stroke="#071326" stroke-width="34" d="${line}"/><path class="pipe" stroke="#50799d" stroke-width="29" d="${line}"/><path class="pipe" stroke="#b5cfe0" stroke-width="24" d="${line}"/><path class="pipe" stroke="#385c82" stroke-width="17" d="${line}"/><path class="pipe" stroke="#102c4b" stroke-width="13" d="${line}"/><g class="liquid" style="opacity:0"><path class="pipe water" d="${line}"/><path class="pipe shine" d="${line}"/></g></svg>`}
function update(){preview=trace(p);let connected=new Set(preview.reached),g=p.crystals.filter(i=>connected.has(i)).length;$('level').textContent=level;$('size').textContent=p.n+'×'+p.n;$('stars').textContent='★ '+progress.stars;$('movesLabel').textContent=mode==='challenge'?'剩余步数':'旋转次数';$('moves').textContent=mode==='challenge'?Math.max(0,p.budget-moves):moves;$('gems').textContent='◆ '+g+' / '+p.crystals.length;$('bar').style.width=100*preview.reached.length/p.path.length+'%';$('bar').style.maxWidth='100%';let ready=preview.won&&g===p.crystals.length;$('valve').classList.toggle('ready',ready&&!busy&&!won);$('valve').textContent=won?'下一关 →':busy?'水流冲刺中…':ready?'✨ 水路就绪 · 打开水阀':'💧 打开水阀';$('valve').disabled=busy;buttons.forEach((b,i)=>{b.classList.toggle('connected',connected.has(i));b.classList.toggle('wet',wet.has(i));b.disabled=busy||won;b.querySelector('.liquid').style.opacity=wet.has(i)?1:connected.has(i)?.24:0;b.setAttribute('aria-label',`第${Math.floor(i/p.n)+1}行第${i%p.n+1}列，接口${[0,1,2,3].filter(d=>p.cells[i]&(1<<d)).map(d=>['上','右','下','左'][d]).join('、')}，点击旋转`)});$('undo').disabled=busy||won||!history.length;$('hint').disabled=busy||won;$('reset').disabled=busy}
function start(){clearTimeout(timer);level=progress.level;p=build(level);moves=0;hints=0;history=[];wet.clear();busy=won=false;$('modal').hidden=true;angles=Array(p.cells.length).fill(0);$('board').style.gridTemplateColumns=`repeat(${p.n},1fr)`;$('world').textContent=['珊瑚海湾','深海秘境','极光水城'][Math.floor((level-1)/10)%3];$('board').innerHTML='';buttons=p.cells.map((mask,i)=>{let b=document.createElement('button');b.className='tile';b.innerHTML=svg(mask)+(p.crystals.includes(i)?'<span class="badge">💎</span>':i===0?'<span class="badge">💧</span>':i===p.cells.length-1?'<span class="badge">⚑</span>':'');b.onclick=()=>tap(i);$('board').append(b);return b});$('status').textContent=mode==='challenge'?`在 ${p.budget} 步内接通，并收集所有水晶。`:'亮蓝色是已连通的路线，收集全部水晶！';update()}
function tap(i){if(busy||won)return;if(mode==='challenge'&&moves>=p.budget){$('status').textContent='步数用完：撤销、提示或重新挑战。';return}let before=trace(p).reached.length;history.push({i,mask:p.cells[i]});p.cells[i]=rotate(p.cells[i]);angles[i]+=90;buttons[i].querySelector('svg').style.transform=`rotate(${angles[i]}deg)`;buttons.forEach(b=>b.classList.remove('hinted'));moves++;wet.clear();play('tap');update();let gain=preview.reached.length-before;if(gain>0){burst(buttons[i],10+gain*2);$('status').textContent=gain>=3?`漂亮！一口气接通 ${gain} 格！`:`接通 +${gain} 格，继续延伸水路。`}else $('status').textContent='寻找下一段接口，水晶都在目标路线中。';if(preview.won&&p.crystals.every(i=>preview.reached.includes(i)))$('status').textContent='水晶已集齐，打开水阀，冲！'}
$('undo').onclick=()=>{let last=history.pop();if(!last||busy||won)return;p.cells[last.i]=last.mask;angles[last.i]-=90;buttons[last.i].querySelector('svg').style.transform=`rotate(${angles[last.i]}deg)`;moves--;wet.clear();update();$('status').textContent='已撤销上一次旋转。'};
$('hint').onclick=()=>{let i=p.path.find(i=>p.cells[i]!==p.solution[i]);if(i===undefined){$('status').textContent='水路已经接好，打开水阀！';return}let k=turns(p.cells[i],p.solution[i]);p.cells[i]=p.solution[i];angles[i]+=k*90;buttons[i].querySelector('svg').style.transform=`rotate(${angles[i]}deg)`;buttons[i].classList.add('hinted');hints++;history=[];wet.clear();burst(buttons[i],20,true);update();$('status').textContent='已修正一段关键管道；使用提示影响星级。'};
$('reset').onclick=()=>{progress.streak=0;save();start()};
function finish(ok){busy=false;update();if(!ok){$('status').textContent=preview.won?'已接到出口，但还没收齐水晶！':'水流被堵住了，看看最后亮起的那一格。';$('stage').classList.remove('shake');void $('stage').offsetWidth;$('stage').classList.add('shake');play('fail');burst(buttons[preview.reached.at(-1)||0],20);return}won=true;let min=p.path.reduce((s,i)=>s+turns(p.initial[i],p.solution[i]),0),earned=hints===0&&moves<=min+2?3:hints<=1&&moves<=p.budget?2:1;progress.stars+=earned;progress.streak++;progress.level=level+1;save();update();$('modalTitle').textContent=earned===3?'完美通水！':'水路畅通！';$('modalStars').textContent='★'.repeat(earned)+'☆'.repeat(3-earned);$('modalText').textContent=`收集 ${p.crystals.length} 颗水晶 · 旋转 ${moves} 次 · ${hints} 次提示`;$('reward').textContent=`+${earned} 星星 · 连胜 ${progress.streak} 关`;play('win');burst($('stage'),90,true);if(navigator.vibrate)navigator.vibrate([30,20,60]);timer=setTimeout(()=>{$('modal').hidden=false;burst($('modalStars'),55,true)},500)}
$('valve').onclick=()=>{if(won){start();return}if(busy)return;let result=trace(p);preview=result;busy=true;wet.clear();update();let k=0;play('water');function step(){if(k>=result.reached.length){finish(result.won&&p.crystals.every(i=>result.reached.includes(i)));return}let i=result.reached[k++];wet.add(i);buttons[i].classList.add('burst');burst(buttons[i],p.crystals.includes(i)?22:6,p.crystals.includes(i));update();timer=setTimeout(step,reduced?20:100)}step()};
$('next').onclick=start;$('close').onclick=()=>{$('modal').hidden=true};for(let m of ['relax','challenge'])$(m).onclick=()=>{if(busy||mode===m)return;mode=m;$('relax').classList.toggle('active',m==='relax');$('challenge').classList.toggle('active',m==='challenge');start()};$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'♫':'♪';$('sound').setAttribute('aria-pressed',String(sound));$('sound').setAttribute('aria-label',sound?'关闭音效':'开启音效');play('water')};start();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').then(r=>r.update()).catch(()=>{});

// Keep game taps and multitouch gestures from zooming the installed game.
for(const eventName of ['gesturestart','gesturechange','gestureend'])document.addEventListener(eventName,e=>e.preventDefault(),{passive:false});

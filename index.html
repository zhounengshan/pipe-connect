<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#092c30"><title>接水管 · 水流工坊</title><style>
*{box-sizing:border-box}body{margin:0;background:#092c30;color:#effff7;font-family:system-ui,-apple-system,sans-serif;min-height:100dvh;background-image:radial-gradient(ellipse at 10% 0%,#235e52 0,transparent 60%)}button{font:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}main{max-width:480px;margin:auto;padding:24px 20px max(24px,env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:12px;letter-spacing:3px;color:#9ac8b4}.sound{border:1px solid #54796c;background:transparent;color:#d2e8dd;border-radius:30px;padding:9px 13px;font-size:12px}h1{font-size:34px;letter-spacing:-1px;margin:24px 0 6px}p{color:#a8cabc;font-size:14px;line-height:1.6}.stats{display:grid;grid-template-columns:repeat(3,1fr);background:#ffffff08;border:1px solid #ffffff15;border-radius:18px;margin:23px 0;padding:16px 0}.stats div{text-align:center;border-right:1px solid #ffffff18}.stats div:last-child{border:0}.stats small{display:block;font-size:11px;color:#a4c0b4;margin-bottom:5px}.stats strong{font-size:23px}.labels{display:flex;justify-content:space-between;align-items:center;margin:16px 4px;font-size:12px}.source{color:#79ead2}.target{color:#ffcf81}.board{display:grid;gap:5px;padding:9px;border-radius:20px;background:#061f24;box-shadow:0 20px 50px #001b2480;border:1px solid #416a62}.tile{position:relative;aspect-ratio:1;background:linear-gradient(145deg,#224a46,#173d3b);border:1px solid #335a51;border-radius:10px;padding:0;overflow:hidden;color:#b1c9bb}.tile svg{width:100%;height:100%;display:block}.tile:active{background:#326658}.tile:focus-visible{outline:3px solid #f5d393;outline-offset:1px}.tile.wet{background:#1a5651}.tile.hinted{box-shadow:inset 0 0 0 3px #f7ca77}.pipe{fill:none;stroke:#809b8d;stroke-width:19;stroke-linecap:butt;stroke-linejoin:round}.inner{stroke:#c2d1ba;stroke-width:11}.water{stroke:#65ecd3;stroke-width:8;stroke-dasharray:8 4;animation:flow .7s linear infinite}.status{min-height:49px;text-align:center;font-size:13px;padding:17px 0;color:#b4d7c5}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}button.secondary{background:#ffffff08;border:1px solid #537264;border-radius:13px;color:#d8e9de;padding:13px}.primary{width:100%;background:#d6ee98;border:0;border-radius:15px;padding:17px;color:#183b2e;font-weight:750;font-size:16px;margin-top:12px;box-shadow:0 5px 0 #7b9853}.primary:active{transform:translateY(2px);box-shadow:0 3px 0 #7b9853}button:disabled{opacity:.55;cursor:default}.help{margin-top:25px;border-top:1px solid #ffffff18;padding-top:17px;font-size:12px;color:#99baac}.help b{color:#d3e6d9}.tag{display:inline-block;background:#ffffff12;border-radius:8px;padding:4px 8px;color:#cbe9a5;font-size:11px;margin-top:10px}@keyframes flow{to{stroke-dashoffset:-24}}@media(prefers-reduced-motion:reduce){.water{animation:none}}@media(max-height:740px){main{padding-top:14px}h1{margin-top:15px}.stats{margin:15px 0;padding:10px 0}.labels{margin:10px 4px}.help{margin-top:15px}}
</style></head><body><main><div class="top"><span class="brand">FLOW LAB / 水流工坊</span><button class="sound" id="sound" aria-pressed="false">音效：关</button></div><span class="tag">轻松解谜 · 无限闯关</span><h1>让每一滴水，<br>找到出口。</h1><p style="margin:0">轻点管道旋转，连通后打开水阀。</p><div class="stats"><div><small>当前关卡</small><strong id="level">01</strong></div><div><small>旋转次数</small><strong id="moves">0</strong></div><div><small>累计星星</small><strong id="stars">0</strong></div></div><div class="labels"><span class="source">↓ 左上 · 水源</span><span class="target">右下 · 出口 ↓</span></div><div class="board" id="board" role="group" aria-label="管道谜题"></div><div class="status" id="status" role="status" aria-live="polite">从左上角出发，接到右下角。</div><div class="actions"><button class="secondary" id="hint">✦ 提示一格</button><button class="secondary" id="reset">↻ 重置本关</button></div><button class="primary" id="valve">打开水阀 →</button><div class="help"><b>玩法</b> · 每点一次，顺时针旋转 90°。水流只沿两端对齐的管道前进。越少旋转、越少提示，星级越高。<br>进度自动保存在当前浏览器，关闭后可继续。</div></main><script>
const dirs=[[-1,0],[0,1],[1,0],[0,-1]];
function rotate(mask){return ((mask<<1)&15)|(mask>>3)}
function random(seed){let x=seed|0;return ()=>{x^=x<<13;x^=x>>>17;x^=x<<5;return (x>>>0)/4294967296}}
function makePuzzle(level){const n=level<4?4:level<12?5:6,rng=random(level*1777+93),end=n*n-1;let path=[],seen=new Set();function dfs(i){path.push(i);seen.add(i);if(i===end)return true;const options=dirs.map((d,k)=>{let r=Math.floor(i/n)+d[0],c=i%n+d[1];return {j:r*n+c,k,r,c,v:rng()}}).filter(o=>o.r>=0&&o.r<n&&o.c>=0&&o.c<n&&!seen.has(o.j)).sort((a,b)=>a.v-b.v);for(const o of options)if(dfs(o.j))return true;seen.delete(i);path.pop();return false}dfs(0);let solution=Array(n*n).fill(0);solution[0]|=1;solution[end]|=4;for(let k=0;k<path.length-1;k++){let a=path[k],b=path[k+1],d=b===a+1?1:b===a-1?3:b>a?2:0;solution[a]|=1<<d;solution[b]|=1<<((d+2)%4)}for(let i=0;i<solution.length;i++)if(!solution[i])solution[i]=rng()<.4?5:3;let cells=solution.map(v=>{for(let k=Math.floor(rng()*4);k>0;k--)v=rotate(v);return v});if(cells.every((v,i)=>v===solution[i]))cells[0]=rotate(cells[0]);return {n,path,solution,cells,initial:[...cells]}}
function trace(p){let reached=[],seen=new Set(),queue=[];if(p.cells[0]&1){queue.push(0);seen.add(0)}while(queue.length){let i=queue.shift();reached.push(i);for(let d=0;d<4;d++){if(!(p.cells[i]&(1<<d)))continue;let r=Math.floor(i/p.n)+dirs[d][0],c=i%p.n+dirs[d][1];if(r<0||r>=p.n||c<0||c>=p.n)continue;let j=r*p.n+c;if(!seen.has(j)&&(p.cells[j]&(1<<((d+2)%4)))){seen.add(j);queue.push(j)}}}return {reached,won:seen.has(p.n*p.n-1)&&!!(p.cells[p.n*p.n-1]&4)}}
let progress={level:1,stars:0};try{let saved=JSON.parse(localStorage.getItem('pipe-connect-v1'));if(saved&&Number.isInteger(saved.level)&&saved.level>0&&saved.level<1000000&&Number.isInteger(saved.stars)&&saved.stars>=0)progress=saved}catch{}
let puzzle,moves=0,hints=0,busy=false,won=false,sound=false,audio,wet=new Set(),hinted=-1,timer=0;const $=id=>document.getElementById(id);
function save(){try{localStorage.setItem('pipe-connect-v1',JSON.stringify(progress));return true}catch{return false}}
function tone(freq=400){if(!sound)return;try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.frequency.value=freq;g.gain.setValueAtTime(.035,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.13);o.start();o.stop(audio.currentTime+.14)}catch{}}
function render(){ $('level').textContent=String(progress.level).padStart(2,'0');$('moves').textContent=moves;$('stars').textContent=progress.stars;$('board').style.gridTemplateColumns=`repeat(${puzzle.n},1fr)`;$('board').innerHTML='';puzzle.cells.forEach((mask,i)=>{let button=document.createElement('button');button.className='tile'+(wet.has(i)?' wet':'')+(hinted===i?' hinted':'');button.disabled=busy||won;let names=dirs.map((_,d)=>mask&(1<<d)?['上','右','下','左'][d]:'').filter(Boolean).join('、');button.setAttribute('aria-label',`第${Math.floor(i/puzzle.n)+1}行第${i%puzzle.n+1}列，接口${names}，点击旋转`);let lines=dirs.map((_,d)=>mask&(1<<d)?`M50 50 L${[50,100,50,0][d]} ${[0,50,100,50][d]}`:'').join(' ');button.innerHTML=`<svg viewBox="0 0 100 100" aria-hidden="true"><path class="pipe" d="${lines}"/><path class="pipe inner" d="${lines}"/>${wet.has(i)?`<path class="pipe water" d="${lines}"/>`:''}<circle cx="50" cy="50" r="5" fill="${wet.has(i)?'#65ecd3':'#e4ddbb'}"/>${i===0||i===puzzle.n*puzzle.n-1?'<circle cx="50" cy="50" r="17" fill="none" stroke="'+(i===0?'#65ecd3':'#ffcf81')+'" stroke-width="3"/>':''}</svg>`;button.onclick=()=>{puzzle.cells[i]=rotate(mask);moves++;wet.clear();hinted=-1;tone(300+i*8);$('status').textContent='管道已旋转，接好后打开水阀。';render()};$('board').append(button)});$('hint').disabled=busy||won;$('reset').disabled=busy;$('valve').disabled=busy;$('valve').textContent=won?'下一关 →':busy?'水流正在前进…':'打开水阀 →'}
function start(){clearTimeout(timer);puzzle=makePuzzle(progress.level);moves=0;hints=0;busy=false;won=false;wet.clear();hinted=-1;$('status').textContent='从左上角出发，接到右下角。';render()}
$('reset').onclick=()=>{puzzle.cells=[...puzzle.initial];moves=0;hints=0;won=false;wet.clear();hinted=-1;$('status').textContent='已恢复本关初始布局。';render()};
$('hint').onclick=()=>{let i=puzzle.path.find(i=>puzzle.cells[i]!==puzzle.solution[i]);if(i===undefined){$('status').textContent='路线已经接好，打开水阀吧！';return}puzzle.cells[i]=puzzle.solution[i];hinted=i;wet.clear();hints++;$('status').textContent='金色框里的管道已调整正确。';tone(660);render()};
$('valve').onclick=()=>{if(won){progress.level++;save();start();return}if(busy)return;let result=trace(puzzle);busy=true;wet.clear();hinted=-1;render();let k=0;function step(){if(k<result.reached.length){wet.add(result.reached[k++]);render();timer=setTimeout(step,90);return}busy=false;if(result.won){won=true;let earned=hints===0&&moves<=puzzle.path.length*2?3:hints<=2?2:1;progress.stars+=earned;let persisted=save();$('status').textContent=`${'★'.repeat(earned)} 水路畅通！获得 ${earned} 颗星。`+(persisted?'':'（浏览器未能保存进度）');tone(880);if(navigator.vibrate)navigator.vibrate([40,30,60])}else{$('status').textContent='水流停住了！检查亮色管道前端的接口。';tone(180)}render()}step()};
$('sound').onclick=()=>{sound=!sound;$('sound').textContent='音效：'+(sound?'开':'关');$('sound').setAttribute('aria-pressed',sound);tone()};start();if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
